name: Add Manual Podcast Episode

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Podcast 單集連結'
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  add-episode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Add episode to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PODCAST_DB: ${{ secrets.NOTION_PODCAST_DB }}
          PODCAST_RSS_URL: ${{ vars.PODCAST_RSS_URL }}
          EP_URL: ${{ inputs.url }}
        run: node .github/scripts/add-podcast-manual.js

  deploy:
    needs: add-episode
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
